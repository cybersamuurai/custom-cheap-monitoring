# Конфигурация custom-cheap-monitoring
#
# Скопируйте в config.conf и отредактируйте:
#   cp config.example.conf config.conf
# Запуск с конфигом:
#   ./custom-cheap-monitoring.sh --config config.conf --once
#
# Порядок приоритета: значения по умолчанию < переменные окружения <
# этот файл < флаги командной строки (для INTERVAL — флаг --interval).
# Если параметром нужно управлять из cron/окружения — удалите его
# строку из конфига.

# Список серверов для проверки доступности (IP или доменные имена),
# разделённые пробелом.
SERVERS="1.1.1.1 8.8.8.8 9.9.9.9"

# Сколько ICMP-пакетов шлёт ping и с каким таймаутом (в секундах).
PING_COUNT=3
PING_TIMEOUT=2

# Порог использования диска в процентах: выше — предупреждение.
DISK_THRESHOLD=90

# Порог 1-минутного load average: выше — предупреждение.
# Ориентир: больше количества процессорных ядер.
CPU_LOAD_THRESHOLD="4.0"

# Куда писать лог. Путь должен быть доступен для записи;
# если нет — события уходят только в stdout (cron перенаправит
# stdout в почтовый отчёт).
LOG_FILE="/var/log/custom-cheap-monitoring.log"

# Интервал прогона в секундах для режима --daemon.
INTERVAL=300
